# DayForge — production stack (static build served by nginx).
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up --build -d
# Shares the `dayforge` project name, so it reuses the same db-data volume.
name: dayforge

services:
  db:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dayforge}
    # No `ports:` on purpose — the database is reachable only inside the
    # compose network, by the service name `db`.
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dayforge} -d ${POSTGRES_DB:-dayforge}']
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: dayforge-frontend:prod
    build:
      context: ./frontend/dayforge-app
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:8080'
    # The image only ever reads: the filesystem is frozen and the two paths
    # nginx must write to are in-memory instead.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # backend:
  #   build:
  #     context: ./backend
  #     target: prod
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: production
  #     PORT: 3000
  #     DATABASE_URL: postgres://${POSTGRES_USER:-dayforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dayforge}
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   security_opt:
  #     - no-new-privileges:true
  #   cap_drop:
  #     - ALL
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  db-data:
